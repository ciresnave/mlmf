# NOTE: mlmf-awq, mlmf-gptq and mlmf-hf-tokenizer's public-API declarations
# live in each crate's OWN .coderipper.toml (crates/<name>/.coderipper.toml),
# not here. Verified directly with coderipper 0.9.6 locally
# (`coderipper check reachability --project crates/mlmf-awq`, 2026-10-23):
# a per-member `--project` run reads the member directory's own
# .coderipper.toml and does NOT fall back to this root file -- an entry
# placed here for a sub-crate path is silently ignored by the per-member
# sweep (confirmed: adding it here left all 23 mlmf-awq findings
# unwaived; moving the identical entry into
# crates/mlmf-awq/.coderipper.toml waived all 23). The crate-level
# "public_api_crates" form that reads from a single root file across a
# whole workspace run is a coderipper 0.9.7 feature, not yet released
# (0.9.6 is current as of this check).
