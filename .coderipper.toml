# Root-level CodeRipper configuration.
#
# Before 0.7.12 this file declared the public API of the legacy root `mlmf`
# package (reachability waivers, one per source file). That package was removed
# (see MIGRATION.md), so there is nothing here to declare: the root manifest is
# a virtual workspace. Each member crate declares its own public API in its own
# `.coderipper.toml`; a per-member run reads only that file and does not fall
# back to this one.
