  # (verified via the crates.io API, 2026-10-23) as standalone "bytes to
  # structure" geometry/config readers, by the charter quoted in this repo's
  # own CLAUDE.md ("MLMF is never intended to be an interpreter of the
  # content of model files"). Each crate's one or two public entry points
