  { file = "src/zip.rs", reason = "published API of mlmf-pickle (crates.io); consumed by Fuel, not by this repository's own targets" },
  { file = "src/vm.rs", reason = "published API of mlmf-pickle (crates.io); consumed by Fuel, not by this repository's own targets" },
  { file = "src/extract.rs", reason = "published API of mlmf-pickle (crates.io); consumed by Fuel, not by this repository's own targets" },
]
