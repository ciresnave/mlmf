[package]
    description          = "HuggingFace shard index: where each tensor lives. Bytes to structure; no I/O."
    edition.workspace    = true
    license.workspace    = true
    name                 = "mlmf-hf-layout"
    repository.workspace = true
    version.workspace    = true

# NO [features] SECTION, deliberately, matching mlmf-conformance and
# mlmf-meta.
#
# `mlmf-core` has `default = []` and NO `std` feature, so the obvious
# `std = ["mlmf-core/std"]` does not resolve -- and a broken feature
# reference in one member fails `cargo` at RESOLUTION for EVERY member,
# taking the whole workspace down rather than just this crate. Measured.
#
# An empty feature set also keeps
# `ci_coverage::a_crate_with_a_second_configuration_is_linted_and_documented_in_it`
# disarmed, which is honest: there is no second configuration to lint.

[dependencies]
    mlmf-core = { path = "../mlmf-core", version = "0.6.0" }
    # Same form as mlmf-safetensors, which parses the safetensors JSON
    # header. `serde_json` types never reach this crate's public API --
    # see mlmf-safetensors/src/header.rs for the rule and its reason.
    #
    # `arbitrary_precision`: without it, an integer literal too big for
    # u64/i64 is converted to a lossy f64 AT PARSE TIME, before this crate
    # ever sees a `Value` -- the original digits are gone and cannot be
    # told apart from a file that actually declared that rounded float.
    # With it, `Number::as_str()` keeps the literal text so config.rs can
    # detect the case and report it as `Declaration::Unreadable` instead
    # of guessing (found by Opus review of PR #119).
    serde_json = { version = "1.0", default-features = false, features = ["std", "arbitrary_precision"] }
