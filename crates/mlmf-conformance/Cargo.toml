[package]
    description          = "Conformance suite for the mlmf-core seam, exercised through two backends at once."
    edition.workspace    = true
    license.workspace    = true
    name                 = "mlmf-conformance"
    # NEVER SHIPPED. This crate exists to hold tests that need more than one
    # backend in one binary, and a consumer has no use for it.
    publish              = false
    repository.workspace = true
    # C7 all the same, and the two fields are ORTHOGONAL rather than
    # redundant. `publish = false` says this artifact does not go to a
    # registry; `version.workspace = true` says that whatever version the
    # workspace is at, this crate is at it too. A crate that never ships
    # still gets built, tested and reasoned about alongside the ones that
    # do, and a member carrying its own hardcoded version is exactly the
    # drift C7 exists to stop -- the root package already did that once,
    # pinning 0.3.0 while [workspace.package] said 0.4.0. Opting out of the
    # registry is not a reason to opt out of the workspace's one number, and
    # `workspace.rs::every_package_carries_the_one_workspace_version` reads
    # this field for every member without asking whether it publishes.
    version.workspace    = true

# PLAIN [dependencies], and that is the ruling rather than a convenience.
#
# This crate is shaped like a CONSUMER: it reaches both backends through
# mlmf-core, which is what Fuel and Lightbulb do. The alternative considered
# and rejected was a [dev-dependencies] edge from mlmf-safetensors to
# mlmf-gguf, which would put an edge between two SIBLING BACKENDS -- neither
# should know the other exists, that being what a seam is -- and would also
# be arbitrary, since nothing says why safetensors would be the one that
# knows about GGUF rather than the reverse.
#
# It would also have needed an exception in
# `mlmf-core/tests/deps.rs::no_table_other_than_plain_dependencies_may_declare_an_edge`,
# whose header says an unanticipated form must fail loudly rather than be
# skipped. That gate refusing the dev-dependency was the design working. The
# answer to a loud failure is to stop needing the exception.
[dependencies]
    # AD-1 differential harness ONLY (tests/fuel_differential.rs), spec §9 §7:
    # "before Fuel switches its dependency, a differential harness parses a
    # real corpus with both the origin implementation and the ported one and
    # asserts byte-identical tensor descriptors and byte-identical tensor
    # bytes." This is a TEST-ONLY edge, not the migration.
    #
    # ⚠️ DO NOT READ THIS LINE AS "THE MIGRATION HAPPENED." It answers a
    # narrower question -- does the port agree with what it was ported from --
    # and that question is worth answering whether or not Fuel ever depends on
    # MLMF: mlmf-gguf/mlmf-ggml were built by porting Fuel's parser (see
    # crates/mlmf-gguf/src/metadata.rs, docs/superpowers/plans/2026-08-15-mlmf-ggml.md)
    # and have since DELIBERATELY diverged from it (35 live ggml codes here vs
    # ~15 in fuel-formats), so an undetected regression in the port is a bug in
    # MLMF regardless of Fuel's adoption decision.
    #
    # `optional = true` behind the `fuel-differential` feature (below, default
    # OFF): a bare `cargo build`/`cargo test` at the workspace root -- what CI
    # runs, and what every other gate in this workspace assumes -- resolves
    # and compiles NONE of this. The spec's own weight analysis (mlmf-core's
    # ≤50-transitive-node ceiling vs the root package's 159) is about a
    # PRODUCTION dependency; an optional, feature-gated, single-test dev edge
    # in a crate that is `publish = false` and never ships carries none of
    # that cost and creates no cycle. Pinned to a commit, not a branch, so the
    # differential's target does not move out from under it silently --
    # re-pin deliberately when Fuel's GGUF/GGML parser changes.
    fuel-formats     = { git = "https://github.com/CireSnave/fuel", rev = "6609d1598939b90e4ca49528f735987eb69b3895", package = "fuel-formats", optional = true }
    mlmf-core        = { path = "../mlmf-core", version = "0.4.0" }
    # For tests/fuel_differential.rs: round-tripping fuel's raw ggml type
    # code through mlmf's own geometry table (GgmlType::from_code/nbytes),
    # which is not re-exported through mlmf-gguf.
    mlmf-ggml        = { path = "../mlmf-ggml", version = "0.4.0" }
    mlmf-gguf        = { path = "../mlmf-gguf", version = "0.4.0" }
    mlmf-meta        = { path = "../mlmf-meta", version = "0.4.0" }
    mlmf-safetensors = { path = "../mlmf-safetensors", version = "0.4.0" }

    # For the cross-project disagreement harness (examples/dump_gguf_meta.rs).
    # lightbulb and mlmf each dump to a stable artifact and a comparator reads
    # both -- deliberately NO cross-repo dependency, because under a git
    # dependency "call mlmf for the thing lightbulb should compute itself"
    # becomes the path of least resistance, and that turns a comparison into a
    # self-check. Agreement from a shared implementation is indistinguishable
    # from agreement between independent ones.
    #
    # serde_json for correct escaping -- template text and token strings carry
    # newlines, quotes and non-ASCII (deepseek's U+FF5C, U+2581), and
    # hand-rolled JSON escaping is exactly the thing that goes subtly wrong.
    # sha2 because the contract is sha256 OF THE UTF-8 BODY, and no crate in
    # this workspace hashes anything.
    serde_json       = { version = "1.0", default-features = false, features = ["std"] }
    sha2             = "0.11"

[features]
    default = []
    # Gates tests/fuel_differential.rs. OFF by default so the fuel-formats
    # edge above is never resolved by a bare `cargo build`/`cargo test` --
    # see the comment on that dependency for why that matters.
    fuel-differential = ["dep:fuel-formats"]
