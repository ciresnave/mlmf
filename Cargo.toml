[workspace]
members = ["crates/*"]
# A virtual workspace does not imply the edition-2024 resolver (the old root
# package did); say it, so dependency resolution is unchanged by the retirement.
resolver = "3"
# A virtual workspace builds every member by default; the list is kept explicit
# so that `workspace.rs::every_gated_crate_is_reachable_from_a_bare_cargo_test`
# keeps proving that a bare `cargo test` reaches each gated crate.
default-members = [
    "crates/mlmf-awq",
    "crates/mlmf-bnb",
    "crates/mlmf-conformance",
    "crates/mlmf-core",
    "crates/mlmf-exl2",
    "crates/mlmf-ggml",
    "crates/mlmf-gguf-arch",
    "crates/mlmf-gguf",
    "crates/mlmf-gptq",
    "crates/mlmf-hf-layout",
    "crates/mlmf-hf-tokenizer",
    "crates/mlmf-meta",
    "crates/mlmf-mlx",
    "crates/mlmf-onnx",
    "crates/mlmf-oracle",
    "crates/mlmf-pickle",
    "crates/mlmf-pt2",
    "crates/mlmf-safetensors",
    "crates/mlmf-source-file",
    "crates/mlmf-stablehlo",
    "crates/mlmf-source-hub",
    "crates/mlmf-tensor-names",
    "crates/mlmf-test-support",
]

[workspace.package]
edition    = "2024"
license    = "MIT OR Apache-2.0"
repository = "https://github.com/CireSnave/mlmf"
version    = "0.11.3"
