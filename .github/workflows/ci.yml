name: CI

# Spec §3.3 is titled "Dependency contracts (enforced in CI, not by review)"
# and calls C2 "the operative control". There was no CI configuration in this
# repository at all: no .github, no .gitlab-ci.yml, no workflow of any kind.
# C1 and the transitive half of C2 were enforced by a human remembering to
# type `bash scripts/check-deps.sh` on a POSIX shell, on a Windows-primary
# repository, and C1's ceiling was never evaluated automatically at all.

on:
  push:
  pull_request:

jobs:
  core-gates:
    # Windows is in the matrix because the target-specific dependency hole
    # (a [target.'cfg(unix)'.dependencies] edge) is invisible to a host-only
    # `cargo tree`, and Linux is in it because the shell gate must run where
    # bash is native.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `@stable`. `stable` is an alias that resolves to a
      # different compiler on a different day, so a green run named no
      # compiler at all. Must match rust-toolchain.toml — enforced by
      # `toolchain_pin_matches_ci` in crates/mlmf-core/tests/ci_coverage.rs,
      # because two places holding one version is exactly how they drift.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      # Formatting is a gate, not a preference. It runs first because it is
      # the cheapest failure to produce and the cheapest to fix, and because
      # a drifting file makes this check unenableable — the drift protects
      # itself until someone sweeps it.
      - name: cargo fmt --all --check
        run: cargo fmt --all -- --check

      # C6: build AND run the suite with default features off, so the
      # mmap-free path is proven functional rather than merely compilable.
      #
      # EVERY gated crate carries one of these steps, and that is enforced
      # rather than remembered:
      # `every_gated_crate_is_run_with_default_features_off` in
      # crates/mlmf-core/tests/ci_coverage.rs derives the crate list from
      # crates/ and requires the exact command. Until that gate existed the
      # flag appeared on this step alone, and later on mlmf-source-file's --
      # and one or two steps carrying a flag is indistinguishable, read down
      # a workflow, from a policy.
      #
      # C6 says "the full parser suite" and this is BROADER than that: it
      # covers mlmf-conformance and mlmf-source-file, neither of which is a
      # parser. A RULING rather than a reading -- more than C6 asks for,
      # which is the safe direction, and taken because the narrower set is
      # not derivable here. The gate's doc comment carries the argument.
      #
      # Five of the six have nothing to subtract today: four declare no
      # [features] table at all, and mlmf-core declares `default = []`. So
      # five of these steps duplicate the plain step beside them, and that
      # is the point -- the step has to be standing BEFORE a crate gains a
      # default feature.
      - name: cargo test -p mlmf-core --no-default-features
        run: cargo test -p mlmf-core --no-default-features

      # C1/C2/C3/C5/C7 all live here as ordinary Rust tests.
      - name: cargo test -p mlmf-core
        run: cargo test -p mlmf-core

      # The same C1/C2 assertion through the script that owns --bless, so the
      # two normalisations cannot silently drift apart.
      - name: scripts/check-deps.sh
        shell: bash
        run: bash scripts/check-deps.sh

      # #![warn(missing_docs)] is only meaningful if a warning fails a build.
      - name: cargo doc -p mlmf-core --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-core --no-deps

      - name: cargo clippy -p mlmf-core
        run: cargo clippy -p mlmf-core --all-targets -- -D warnings

      - name: cargo test -p mlmf-ggml
        run: cargo test -p mlmf-ggml

      - name: cargo test -p mlmf-ggml --no-default-features
        run: cargo test -p mlmf-ggml --no-default-features

      - name: cargo doc -p mlmf-ggml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-ggml --no-deps

      - name: cargo clippy -p mlmf-ggml
        run: cargo clippy -p mlmf-ggml --all-targets -- -D warnings

      - name: cargo test -p mlmf-gguf
        run: cargo test -p mlmf-gguf

      - name: cargo test -p mlmf-gguf --no-default-features
        run: cargo test -p mlmf-gguf --no-default-features

      - name: cargo doc -p mlmf-gguf --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-gguf --no-deps

      - name: cargo clippy -p mlmf-gguf
        run: cargo clippy -p mlmf-gguf --all-targets -- -D warnings

      - name: cargo test -p mlmf-safetensors
        run: cargo test -p mlmf-safetensors

      - name: cargo test -p mlmf-safetensors --no-default-features
        run: cargo test -p mlmf-safetensors --no-default-features

      - name: cargo doc -p mlmf-safetensors --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-safetensors --no-deps

      - name: cargo clippy -p mlmf-safetensors
        run: cargo clippy -p mlmf-safetensors --all-targets -- -D warnings

      # mlmf-conformance is never published and is gated exactly like the
      # crates that are. It is the only member linking more than one backend
      # into one binary, which is what a cross-backend seam test needs and
      # what neither backend may have.
      - name: cargo test -p mlmf-conformance
        run: cargo test -p mlmf-conformance

      - name: cargo test -p mlmf-conformance --no-default-features
        run: cargo test -p mlmf-conformance --no-default-features

      - name: cargo doc -p mlmf-conformance --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-conformance --no-deps

      - name: cargo clippy -p mlmf-conformance
        run: cargo clippy -p mlmf-conformance --all-targets -- -D warnings

      # mlmf-meta sits above mlmf-core and below every format crate: it holds
      # the spec §5 canonical key vocabulary as DATA and reads a
      # MetadataSource, so it has no I/O and names no format crate (C4).
      #
      # FOUR steps, not six, and that is a consequence rather than an
      # omission. `a_crate_with_a_second_configuration_is_linted_and_documented_in_it`
      # arms only on a NON-EMPTY default feature list; mlmf-meta declares no
      # `[features]` at all, so there is no second configuration and the
      # --no-default-features clippy and doc steps would lint the same build
      # twice. The `cargo test --no-default-features` step below is still
      # required: C6 pins that the suite RUNS in that configuration, whether
      # or not the configuration differs.
      - name: cargo test -p mlmf-meta
        run: cargo test -p mlmf-meta

      - name: cargo test -p mlmf-meta --no-default-features
        run: cargo test -p mlmf-meta --no-default-features

      - name: cargo doc -p mlmf-meta --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-meta --no-deps

      - name: cargo clippy -p mlmf-meta
        run: cargo clippy -p mlmf-meta --all-targets -- -D warnings

      # mlmf-source-file is the first crate on the SOURCE axis (spec §3.1):
      # I/O only, no format knowledge. It is gated exactly like the format
      # crates -- the axis scopes C3's prohibition on naming `memmap2`, and
      # nothing else.
      - name: cargo test -p mlmf-source-file
        run: cargo test -p mlmf-source-file

      # C6: "CI builds AND RUNS the full parser suite with
      # --no-default-features, proving the mmap-free path is functional
      # rather than merely compilable."
      #
      # This is the ONE step of the six for which the flag currently
      # subtracts anything. `default = ["mmap"]`, and src/file.rs is the
      # only `#[cfg(feature = ...)]` anywhere under crates/*/src, so this
      # run exercises the `std::fs::read` path while the step above it
      # exercises the mapping. It was added one task BEFORE that feature
      # existed, when it did duplicate the step above it, because a step
      # added in the same commit as the feature it is supposed to subtract
      # has never once been observed to fail.
      - name: cargo test -p mlmf-source-file --no-default-features
        run: cargo test -p mlmf-source-file --no-default-features

      - name: cargo doc -p mlmf-source-file --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-source-file --no-deps

      - name: cargo clippy -p mlmf-source-file
        run: cargo clippy -p mlmf-source-file --all-targets -- -D warnings

      # The OTHER half of C6, and the half that was missing.
      #
      # C6 reads "builds AND RUNS the full parser suite with
      # --no-default-features, proving the mmap-free path is functional
      # rather than merely compilable". The test step above enforces the
      # RUNNING. Until these two steps existed, twelve `cargo test` steps
      # covered both configurations while all six `clippy` and all six
      # `cargo doc` steps saw only the default -- so the `mmap = off` arm of
      # src/file.rs was run and never linted, in the one path C6 names.
      #
      # Only this crate needs them: it is the only one declaring a non-empty
      # `default`. mlmf-core declares `default = []` and the other four have
      # no [features] table, so the flag is a no-op for five of six and
      # twelve steps would be ten that assert nothing.
      # `ci_coverage.rs::a_crate_with_a_second_configuration_is_linted_and_documented_in_it`
      # is keyed on that condition and arms itself for the next crate that
      # takes a real feature.
      - name: cargo clippy -p mlmf-source-file --no-default-features
        run: cargo clippy -p mlmf-source-file --all-targets --no-default-features -- -D warnings

      - name: cargo doc -p mlmf-source-file --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-source-file --no-deps --no-default-features

# NOT gated here, deliberately and on the record: the legacy root `mlmf`
# package. It depends on `candlelight` from git and runs a `prost-build`
# build script, so it needs `protoc` and a long build. Spec §11 schedules it
# for rewrite across the format axis rather than repair. When that lands,
# `cargo test --workspace` belongs in the matrix above and the `mlmf` entry
# comes out of BUILD_SCRIPT_ALLOWED in crates/mlmf-core/tests/workspace.rs.
