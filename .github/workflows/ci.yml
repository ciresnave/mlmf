name: CI

# Spec §3.3 is titled "Dependency contracts (enforced in CI, not by review)"
# and calls C2 "the operative control". There was no CI configuration in this
# repository at all: no .github, no .gitlab-ci.yml, no workflow of any kind.
# C1 and the transitive half of C2 were enforced by a human remembering to
# type `bash scripts/check-deps.sh` on a POSIX shell, on a Windows-primary
# repository, and C1's ceiling was never evaluated automatically at all.

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  core-gates:
    # Windows is in the matrix because the target-specific dependency hole
    # (a [target.'cfg(unix)'.dependencies] edge) is invisible to a host-only
    # `cargo tree`, and Linux is in it because the shell gate must run where
    # bash is native.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned, not `@stable`. `stable` is an alias that resolves to a
      # different compiler on a different day, so a green run named no
      # compiler at all. Must match rust-toolchain.toml — enforced by
      # `toolchain_pin_matches_ci` in crates/mlmf-core/tests/ci_coverage.rs,
      # because two places holding one version is exactly how they drift.
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0 (branch)
        with:
          components: rustfmt

      # Cargo.lock must already satisfy every manifest.
      #
      # MOVED HERE, FIRST, 2026-10-23 — it used to run after
      # `cargo test -p mlmf-core` (twice) and `scripts/check-deps.sh`, all of
      # which invoke cargo WITHOUT --locked. An unlocked cargo invocation is
      # free to resolve and rewrite the IN-RUNNER Cargo.lock to match
      # whatever the manifest says, silently, before this step ever ran — so
      # by the time `--locked` checked it, there was nothing left to catch.
      # Measured directly: restore the real committed #127 pair (workspace
      # version 0.6.6, lockfile entries still 0.6.5 — #128's own defect),
      # run `cargo metadata --locked` first (exit 101, as expected), then
      # run `cargo test -p mlmf-core --no-default-features` (unlocked) and
      # diff Cargo.lock — all 14 member version lines flip to 0.6.6 with no
      # error anywhere — then run `cargo metadata --locked` again: exit 0.
      # That is exactly why PR #128's drift shipped on main with every
      # `core-gates` leg green: this step was running fourth, not first.
      #
      # `cargo metadata` because it resolves without compiling: the check is
      # about the lockfile, and it should not wait on a build to say so.
      # Adopted from lightbulb's #64, which found the same gap in their tree
      # after this repo found the defect it catches.
      # ⚠️ `shell: bash` IS LOAD-BEARING, and its absence was a FALSE RED on
      # Windows: the default shell there is pwsh, where `> /dev/null` is not
      # a discard but an invalid PATH, so the step failed with `OpenError`
      # while the lockfile was perfectly clean. A gate that fails for a
      # reason unrelated to its subject is worse than no gate -- it teaches
      # readers to skip it.
      #
      # ⚠️ AND `scripts/local-gates.sh` CANNOT CATCH THIS CLASS. It extracts
      # `run:` lines and executes all of them in bash, so a step that only
      # works in bash passes locally and fails only on the Windows matrix
      # leg. The local gate was RIGHT about bash and SILENT about pwsh, and
      # reported 37/37. Anything added here with a redirect, a pipe, `&&` or
      # `$(...)` needs this line.
      - name: cargo metadata --locked
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      # Formatting is a gate, not a preference. It runs first among the
      # BUILD steps because it is the cheapest failure to produce and the
      # cheapest to fix, and because a drifting file makes this check
      # unenableable — the drift protects itself until someone sweeps it.
      - name: cargo fmt --all --check
        run: cargo fmt --all -- --check

      # C6: build AND run the suite with default features off, so the
      # mmap-free path is proven functional rather than merely compilable.
      #
      # EVERY gated crate carries one of these steps, and that is enforced
      # rather than remembered:
      # `every_gated_crate_is_run_with_default_features_off` in
      # crates/mlmf-core/tests/ci_coverage.rs derives the crate list from
      # crates/ and requires the exact command. Until that gate existed the
      # flag appeared on this step alone, and later on mlmf-source-file's --
      # and one or two steps carrying a flag is indistinguishable, read down
      # a workflow, from a policy.
      #
      # C6 says "the full parser suite" and this is BROADER than that: it
      # covers mlmf-conformance and mlmf-source-file, neither of which is a
      # parser. A RULING rather than a reading -- more than C6 asks for,
      # which is the safe direction, and taken because the narrower set is
      # not derivable here. The gate's doc comment carries the argument.
      #
      # Five of the six have nothing to subtract today: four declare no
      # [features] table at all, and mlmf-core declares `default = []`. So
      # five of these steps duplicate the plain step beside them, and that
      # is the point -- the step has to be standing BEFORE a crate gains a
      # default feature.
      - name: cargo test -p mlmf-core --no-default-features
        run: cargo test -p mlmf-core --no-default-features

      # C1/C2/C3/C5/C7 all live here as ordinary Rust tests.
      - name: cargo test -p mlmf-core
        run: cargo test -p mlmf-core

      # The same C1/C2 assertion through the script that owns --bless, so the
      # two normalisations cannot silently drift apart.
      - name: scripts/check-deps.sh
        shell: bash
        run: bash scripts/check-deps.sh

      # #![warn(missing_docs)] is only meaningful if a warning fails a build.
      - name: cargo doc -p mlmf-core --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-core --no-deps

      - name: cargo clippy -p mlmf-core
        run: cargo clippy -p mlmf-core --all-targets -- -D warnings

      # mlmf-exl2 detects EXL2 quantization and refuses with a named,
      # typed error -- it is NOT a geometry crate (see the design spec
      # §1.3/§3.3 for why real verification ruled that out). Format axis,
      # no mlmf-core dependency at all, `default = []`, so the plain four
      # steps.
      - name: cargo test -p mlmf-exl2
        run: cargo test -p mlmf-exl2

      - name: cargo test -p mlmf-exl2 --no-default-features
        run: cargo test -p mlmf-exl2 --no-default-features

      - name: cargo doc -p mlmf-exl2 --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-exl2 --no-deps

      - name: cargo clippy -p mlmf-exl2
        run: cargo clippy -p mlmf-exl2 --all-targets -- -D warnings

      - name: cargo test -p mlmf-ggml
        run: cargo test -p mlmf-ggml

      - name: cargo test -p mlmf-ggml --no-default-features
        run: cargo test -p mlmf-ggml --no-default-features

      - name: cargo doc -p mlmf-ggml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-ggml --no-deps

      - name: cargo clippy -p mlmf-ggml
        run: cargo clippy -p mlmf-ggml --all-targets -- -D warnings

      - name: cargo test -p mlmf-gguf
        run: cargo test -p mlmf-gguf

      - name: cargo test -p mlmf-gguf --no-default-features
        run: cargo test -p mlmf-gguf --no-default-features

      - name: cargo doc -p mlmf-gguf --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-gguf --no-deps

      - name: cargo clippy -p mlmf-gguf
        run: cargo clippy -p mlmf-gguf --all-targets -- -D warnings

      # mlmf-gptq locates GPTQ-packed linear layers in an already-open
      # TensorContainer and parses quantize_config.json / config.json's
      # embedded quantization_config. Format axis: no I/O, `default = []`
      # same as mlmf-core, so the plain four steps.
      - name: cargo test -p mlmf-gptq
        run: cargo test -p mlmf-gptq

      - name: cargo test -p mlmf-gptq --no-default-features
        run: cargo test -p mlmf-gptq --no-default-features

      - name: cargo doc -p mlmf-gptq --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-gptq --no-deps

      - name: cargo clippy -p mlmf-gptq
        run: cargo clippy -p mlmf-gptq --all-targets -- -D warnings

      # mlmf-awq locates AWQ-packed linear layers in an already-open
      # TensorContainer and parses quant_config.json / config.json's
      # embedded quantization_config. Format axis: no I/O, `default = []`
      # same as mlmf-core, so the plain four steps.
      - name: cargo test -p mlmf-awq
        run: cargo test -p mlmf-awq

      - name: cargo test -p mlmf-awq --no-default-features
        run: cargo test -p mlmf-awq --no-default-features

      - name: cargo doc -p mlmf-awq --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-awq --no-deps

      - name: cargo clippy -p mlmf-awq
        run: cargo clippy -p mlmf-awq --all-targets -- -D warnings

      # mlmf-gguf-arch names a GGUF file's architecture family from a
      # MetadataSource and tensor descriptors. Format axis: no I/O, `default = []`
      # same as mlmf-core, so the plain four steps.
      - name: cargo test -p mlmf-gguf-arch
        run: cargo test -p mlmf-gguf-arch

      - name: cargo test -p mlmf-gguf-arch --no-default-features
        run: cargo test -p mlmf-gguf-arch --no-default-features

      - name: cargo doc -p mlmf-gguf-arch --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-gguf-arch --no-deps

      - name: cargo clippy -p mlmf-gguf-arch
        run: cargo clippy -p mlmf-gguf-arch --all-targets -- -D warnings

      # mlmf-tensor-names translates tensor names between HuggingFace and GGUF spellings from
      # a declared table. Format axis: pure functions over strings, no
      # dependencies, `default = []`, so the plain four steps.
      - name: cargo test -p mlmf-tensor-names
        run: cargo test -p mlmf-tensor-names

      - name: cargo test -p mlmf-tensor-names --no-default-features
        run: cargo test -p mlmf-tensor-names --no-default-features

      - name: cargo doc -p mlmf-tensor-names --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-tensor-names --no-deps

      - name: cargo clippy -p mlmf-tensor-names
        run: cargo clippy -p mlmf-tensor-names --all-targets -- -D warnings

      # mlmf-oracle holds the tensor-name mapping file and the checked Oracle
      # seam. Format axis: no I/O, no features, so the plain four steps.
      - name: cargo test -p mlmf-oracle
        run: cargo test -p mlmf-oracle

      - name: cargo test -p mlmf-oracle --no-default-features
        run: cargo test -p mlmf-oracle --no-default-features

      - name: cargo doc -p mlmf-oracle --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-oracle --no-deps

      - name: cargo clippy -p mlmf-oracle
        run: cargo clippy -p mlmf-oracle --all-targets -- -D warnings

      # mlmf-pickle reads a torch.save checkpoint's zip directory and tensor
      # index with a bounded pickle reader that executes nothing. Format axis:
      # no I/O, `default = []`, so the plain four steps. The real-checkpoint
      # test skips here (no MLMF_PTH_FILE) and says so.
      - name: cargo test -p mlmf-pickle
        run: cargo test -p mlmf-pickle

      - name: cargo test -p mlmf-pickle --no-default-features
        run: cargo test -p mlmf-pickle --no-default-features

      - name: cargo doc -p mlmf-pickle --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-pickle --no-deps

      - name: cargo clippy -p mlmf-pickle
        run: cargo clippy -p mlmf-pickle --all-targets -- -D warnings

      # mlmf-bnb locates bitsandbytes 4-bit layers in an already-open
      # TensorContainer and reads their raw pieces and quant_state JSON.
      # Format axis: no I/O, `default = []`, so the plain four steps.
      - name: cargo test -p mlmf-bnb
        run: cargo test -p mlmf-bnb

      - name: cargo test -p mlmf-bnb --no-default-features
        run: cargo test -p mlmf-bnb --no-default-features

      - name: cargo doc -p mlmf-bnb --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-bnb --no-deps

      - name: cargo clippy -p mlmf-bnb
        run: cargo clippy -p mlmf-bnb --all-targets -- -D warnings

      # mlmf-onnx writes ONNX ModelProto files from caller-supplied tensors,
      # metadata and opaque node bytes. Format axis: no I/O, `default = []`,
      # so the plain four steps.
      - name: cargo test -p mlmf-onnx
        run: cargo test -p mlmf-onnx

      - name: cargo test -p mlmf-onnx --no-default-features
        run: cargo test -p mlmf-onnx --no-default-features

      - name: cargo doc -p mlmf-onnx --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-onnx --no-deps

      - name: cargo clippy -p mlmf-onnx
        run: cargo clippy -p mlmf-onnx --all-targets -- -D warnings

      # mlmf-stablehlo reads and writes the MLIR bytecode container of
      # StableHLO portable artifacts (section contents opaque). Format axis:
      # no I/O, `default = []`, so the plain four steps.
      - name: cargo test -p mlmf-stablehlo
        run: cargo test -p mlmf-stablehlo

      - name: cargo test -p mlmf-stablehlo --no-default-features
        run: cargo test -p mlmf-stablehlo --no-default-features

      - name: cargo doc -p mlmf-stablehlo --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-stablehlo --no-deps

      - name: cargo clippy -p mlmf-stablehlo
        run: cargo clippy -p mlmf-stablehlo --all-targets -- -D warnings

      # mlmf-pt2 reads and writes torch.export .pt2 archives (zip layout,
      # weights/constants configs, raw tensor bytes; the graph is opaque).
      # Format axis: no I/O, `default = []`, so the plain four steps.
      - name: cargo test -p mlmf-pt2
        run: cargo test -p mlmf-pt2

      - name: cargo test -p mlmf-pt2 --no-default-features
        run: cargo test -p mlmf-pt2 --no-default-features

      - name: cargo doc -p mlmf-pt2 --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-pt2 --no-deps

      - name: cargo clippy -p mlmf-pt2
        run: cargo clippy -p mlmf-pt2 --all-targets -- -D warnings

      - name: cargo test -p mlmf-safetensors
        run: cargo test -p mlmf-safetensors

      - name: cargo test -p mlmf-safetensors --no-default-features
        run: cargo test -p mlmf-safetensors --no-default-features

      - name: cargo doc -p mlmf-safetensors --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-safetensors --no-deps

      - name: cargo clippy -p mlmf-safetensors
        run: cargo clippy -p mlmf-safetensors --all-targets -- -D warnings

      # mlmf-conformance is never published and is gated exactly like the
      # crates that are. It is the only member linking more than one backend
      # into one binary, which is what a cross-backend seam test needs and
      # what neither backend may have.
      - name: cargo test -p mlmf-conformance
        run: cargo test -p mlmf-conformance

      - name: cargo test -p mlmf-conformance --no-default-features
        run: cargo test -p mlmf-conformance --no-default-features

      - name: cargo doc -p mlmf-conformance --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-conformance --no-deps

      - name: cargo clippy -p mlmf-conformance
        run: cargo clippy -p mlmf-conformance --all-targets -- -D warnings

      # AD-1-for-safetensors, actually running in CI. Downloads the SEVEN
      # SMALL files of mlmf-conformance/tests/fuel_differential_safetensors.rs's
      # corpus, each pinned by REVISION SHA (never a branch — a Hub repo can
      # be force-pushed, and `main` moving underneath this differential would
      # make its green mean a different thing tomorrow than it does today).
      #
      # The two large files (SmolLM2 723 MB, TinyLlama 2.2 GB) are
      # deliberately NOT fetched here -- LOCAL_ONLY_LARGE_FILES in that test
      # file is what makes their absence not count against completeness, so
      # MLMF_CORPUS_REQUIRED=1 below still passes with only these seven.
      #
      # None of these seven are committed to this repository. Two of the
      # three source repos (hf-internal-testing/tiny-random-bert-sharded,
      # hf-internal-testing/tiny-random-gpt2) have NO stated licence -- no
      # `license:` tag, no LICENSE file, no README.md -- so there is nothing
      # to cite a licence from, and "widely used, 2.4M/41.4M downloads" is
      # not a grant. `stas/tiny-random-llama-2` IS Apache-2.0, but every file
      # here is fetched-not-vendored uniformly rather than half-committed,
      # half-downloaded -- one mechanism to reason about as the corpus grows.
      - name: download the small AD-1-for-safetensors corpus
        shell: bash
        run: |
          set -euo pipefail
          root="${{ runner.temp }}/mlmf-safetensors-corpus"
          mkdir -p "$root/tiny-random-bert-sharded" "$root/tiny-random-gpt2" "$root/tiny-random-llama-2"

          bert_sha="04a52fc6ff50bf21639d65be441bd2bd8410ef5d"
          bert_base="https://huggingface.co/hf-internal-testing/tiny-random-bert-sharded/resolve/$bert_sha"
          for shard in 00001 00002 00003 00004 00005; do
            curl -sL --fail -o "$root/tiny-random-bert-sharded/model-$shard-of-00005.safetensors" \
              "$bert_base/model-$shard-of-00005.safetensors"
          done
          curl -sL --fail -o "$root/tiny-random-bert-sharded/model.safetensors.index.json" \
            "$bert_base/model.safetensors.index.json"

          curl -sL --fail -o "$root/tiny-random-gpt2/model.safetensors" \
            "https://huggingface.co/hf-internal-testing/tiny-random-gpt2/resolve/71034c5d8bde858ff824298bdedc65515b97d2b9/model.safetensors"

          curl -sL --fail -o "$root/tiny-random-llama-2/model.safetensors" \
            "https://huggingface.co/stas/tiny-random-llama-2/resolve/3579d71fd57e04f5a364d824d3a2ec3e913dbb67/model.safetensors"

      # MLMF_CORPUS_REQUIRED=1 turns a download failure OR a real descriptor
      # disagreement into a red CI run rather than a silent skip --
      # `corpus_or_skip` in the test file is the mechanism, and a corpus
      # download step without this variable set would prove nothing while
      # looking exactly like success (measured before this step existed: the
      # same harness merged in #83/#85 had never been seen to fail in CI).
      # `--test fuel_differential_safetensors` scopes this to the file above
      # ALONE: the sibling GGUF/GGML differential below fetches its own,
      # much smaller, corpus and would fail this one's skip-check if the two
      # ran under one shared `--features fuel-differential` invocation.
      - name: cargo test -p mlmf-conformance --features fuel-differential --test fuel_differential_safetensors
        shell: bash
        env:
          MLMF_SAFETENSORS_CORPUS: ${{ runner.temp }}/mlmf-safetensors-corpus
          MLMF_CORPUS_REQUIRED: "1"
        run: cargo test -p mlmf-conformance --features fuel-differential --test fuel_differential_safetensors

      # AD-1-for-GGUF's agreement guard, actually running in CI. The 28-file
      # local corpus (1.13 GiB) stays local-only: its own divergence
      # (IQ4_NL/IQ3_S/IQ4_XS) is structurally guaranteed by fuel's own
      # `GgmlDType` enum lacking those variants at compile time
      # (`fuel-ir/src/quantized.rs:14`), so it cannot silently start or stop
      # -- guarding it here would spend ~255 MiB/run protecting something
      # that cannot quietly break. What CAN quietly break is the AGREEMENT on
      # the 15 codes both `mlmf-gguf` and `fuel-formats` claim to know: two
      # independently-maintained codebases that have already diverged once
      # (this crate's 35-code table vs fuel's 15). `CI_REQUIRED_FILES` in
      # `fuel_differential.rs` names the two small files fetched here and is
      # the crux of the whole design -- see that file's own "Running in CI"
      # doc section for the full reasoning, licence note, and the
      # already-renamed-once risk on this source repo.
      #
      # If this download step ever 404s: that is a FETCH failure, not a
      # differential failure -- `ggml-org/models` has already been renamed
      # once to `ggml-org/models-moved` (used below), and could move again.
      # The fix is to find the new location and re-point this URL, recording
      # the change in both places (here and the test file's doc) -- NOT to
      # delete the step. A failure here shows up as `curl: (22)` from THIS
      # step, distinguishable in the log from a `descriptors_agree_over_the_
      # corpus` assertion failure in the step below it.
      #
      # Neither file is committed to this repository. `ggml-org/models-moved`
      # has no `license:` tag, no LICENSE file, and no `general.license` in
      # the GGUF metadata itself -- its own README says "Various models to be
      # used in llama.cpp CI workflow. Do not use it in production", which is
      # a fitness disclaimer, not a redistribution grant. Same ruling as the
      # two unlicensed safetensors fixtures above: fetched at CI time, never
      # vendored.
      - name: download the small AD-1-for-GGUF agreement-guard corpus
        shell: bash
        run: |
          set -euo pipefail
          root="${{ runner.temp }}/mlmf-gguf-corpus/tinyllamas"
          mkdir -p "$root"
          sha="499bc8821c6b12b4e53c5bffcb21ec206f212d81"
          base="https://huggingface.co/ggml-org/models-moved/resolve/$sha/tinyllamas"
          curl -sL --fail -o "$root/stories15M-q4_0.gguf" "$base/stories15M-q4_0.gguf"
          curl -sL --fail -o "$root/stories15M-q8_0.gguf" "$base/stories15M-q8_0.gguf"

      # Runs the WHOLE file, no test-name filter -- unlike an earlier version
      # of this step, deliberately reverted (see #89's history): a filter
      # here would make every FUTURE test added to fuel_differential.rs
      # silently not run in CI unless someone remembered to update this
      # line, and it would hide the exclusion reasoning in workflow config
      # instead of in the test file a reader actually opens.
      # `mlmf_refuses_v1_that_fuel_reads` skips itself gracefully (it always
      # has, for the local-corpus-absent case) using its OWN flag,
      # `MLMF_V1_FIXTURE_REQUIRED` -- never set here, deliberately, so its
      # expected CI skip cannot be confused with `MLMF_CORPUS_REQUIRED`
      # catching a genuinely incomplete agreement-guard corpus. See that
      # test's own doc and `v1_fixture_required`'s doc in the test file for
      # why the two flags must stay separate.
      - name: cargo test -p mlmf-conformance --features fuel-differential --test fuel_differential (GGUF agreement guard)
        shell: bash
        env:
          MLMF_GGUF_CORPUS: ${{ runner.temp }}/mlmf-gguf-corpus
          MLMF_CORPUS_REQUIRED: "1"
        run: cargo test -p mlmf-conformance --features fuel-differential --test fuel_differential

      # mlmf-meta sits above mlmf-core and below every format crate: it holds
      # the spec §5 canonical key vocabulary as DATA and reads a
      # MetadataSource, so it has no I/O and names no format crate (C4).
      #
      # FOUR steps, not six, and that is a consequence rather than an
      # omission. `a_crate_with_a_second_configuration_is_linted_and_documented_in_it`
      # arms only on a NON-EMPTY default feature list; mlmf-meta declares no
      # `[features]` at all, so there is no second configuration and the
      # --no-default-features clippy and doc steps would lint the same build
      # twice. The `cargo test --no-default-features` step below is still
      # required: C6 pins that the suite RUNS in that configuration, whether
      # or not the configuration differs.
      - name: cargo test -p mlmf-meta
        run: cargo test -p mlmf-meta

      - name: cargo test -p mlmf-meta --no-default-features
        run: cargo test -p mlmf-meta --no-default-features

      - name: cargo doc -p mlmf-meta --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-meta --no-deps

      - name: cargo clippy -p mlmf-meta
        run: cargo clippy -p mlmf-meta --all-targets -- -D warnings

      # mlmf-hf-layout parses a HuggingFace checkpoint's shard index and
      # reports where each tensor lives (spec line 90). Format axis: bytes
      # in, structure out, and it "never enumerates a directory" -- the
      # caller reads the file and hands over the bytes.
      #
      # FOUR steps, not six, for the same reason as mlmf-meta and
      # mlmf-conformance: `a_crate_with_a_second_configuration_is_linted_and
      # _documented_in_it` arms only on a NON-EMPTY default feature list, and
      # this crate declares no `[features]` at all. The C6 test step below is
      # still required -- it pins that the suite RUNS in that configuration,
      # whether or not the configuration differs.
      - name: cargo test -p mlmf-hf-layout
        run: cargo test -p mlmf-hf-layout

      - name: cargo test -p mlmf-hf-layout --no-default-features
        run: cargo test -p mlmf-hf-layout --no-default-features

      - name: cargo doc -p mlmf-hf-layout --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-hf-layout --no-deps

      - name: cargo clippy -p mlmf-hf-layout
        run: cargo clippy -p mlmf-hf-layout --all-targets -- -D warnings

      # mlmf-hf-tokenizer reads tokenizer.json's declared vocab+merges for
      # the BPE model type. Format axis: no I/O, `default = []` same as
      # mlmf-core, so the plain four steps.
      - name: cargo test -p mlmf-hf-tokenizer
        run: cargo test -p mlmf-hf-tokenizer

      - name: cargo test -p mlmf-hf-tokenizer --no-default-features
        run: cargo test -p mlmf-hf-tokenizer --no-default-features

      - name: cargo doc -p mlmf-hf-tokenizer --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-hf-tokenizer --no-deps

      - name: cargo clippy -p mlmf-hf-tokenizer
        run: cargo clippy -p mlmf-hf-tokenizer --all-targets -- -D warnings

      # mlmf-source-file is the first crate on the SOURCE axis (spec §3.1):
      # I/O only, no format knowledge. It is gated exactly like the format
      # crates -- the axis scopes C3's prohibition on naming `memmap2`, and
      # nothing else.
      - name: cargo test -p mlmf-source-file
        run: cargo test -p mlmf-source-file

      # C6: "CI builds AND RUNS the full parser suite with
      # --no-default-features, proving the mmap-free path is functional
      # rather than merely compilable."
      #
      # This is the ONE step of the six for which the flag currently
      # subtracts anything. `default = ["mmap"]`, and src/file.rs is the
      # only `#[cfg(feature = ...)]` anywhere under crates/*/src, so this
      # run exercises the `std::fs::read` path while the step above it
      # exercises the mapping. It was added one task BEFORE that feature
      # existed, when it did duplicate the step above it, because a step
      # added in the same commit as the feature it is supposed to subtract
      # has never once been observed to fail.
      - name: cargo test -p mlmf-source-file --no-default-features
        run: cargo test -p mlmf-source-file --no-default-features

      - name: cargo doc -p mlmf-source-file --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-source-file --no-deps

      - name: cargo clippy -p mlmf-source-file
        run: cargo clippy -p mlmf-source-file --all-targets -- -D warnings

      # The OTHER half of C6, and the half that was missing.
      #
      # C6 reads "builds AND RUNS the full parser suite with
      # --no-default-features, proving the mmap-free path is functional
      # rather than merely compilable". The test step above enforces the
      # RUNNING. Until these two steps existed, twelve `cargo test` steps
      # covered both configurations while all six `clippy` and all six
      # `cargo doc` steps saw only the default -- so the `mmap = off` arm of
      # src/file.rs was run and never linted, in the one path C6 names.
      #
      # Only this crate needs them: it is the only one declaring a non-empty
      # `default`. mlmf-core declares `default = []` and the other four have
      # no [features] table, so the flag is a no-op for five of six and
      # twelve steps would be ten that assert nothing.
      # `ci_coverage.rs::a_crate_with_a_second_configuration_is_linted_and_documented_in_it`
      # is keyed on that condition and arms itself for the next crate that
      # takes a real feature.
      - name: cargo clippy -p mlmf-source-file --no-default-features
        run: cargo clippy -p mlmf-source-file --all-targets --no-default-features -- -D warnings

      - name: cargo doc -p mlmf-source-file --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-source-file --no-deps --no-default-features

      # mlmf-source-hub: the second crate on the SOURCE axis, and the only
      # crate in the workspace with a TLS edge (spec §3.2, §9 §6 HUB-1/
      # HUB-2). `default = []`, same as mlmf-core, so this gets the plain
      # four steps -- not mlmf-source-file's extra pair, which exist only
      # because THAT crate's `default` is non-empty.
      #
      # `tests/live_hub.rs` is NOT run by the plain step below:
      # `required-features = ["live-hub"]` in this crate's Cargo.toml keeps
      # it from even being BUILT without that flag, so CI (and any
      # contributor without Hub access) gets a clean, network-free pass.
      # That test exists and was run manually against the real Hub before
      # this crate was proposed for merge; it is not wired into CI because
      # this repo has no other job that assumes network egress, matching
      # how `mlmf-conformance --features fuel-differential` is handled.
      - name: cargo test -p mlmf-source-hub
        run: cargo test -p mlmf-source-hub

      - name: cargo test -p mlmf-source-hub --no-default-features
        run: cargo test -p mlmf-source-hub --no-default-features

      - name: cargo doc -p mlmf-source-hub --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p mlmf-source-hub --no-deps

      - name: cargo clippy -p mlmf-source-hub
        run: cargo clippy -p mlmf-source-hub --all-targets -- -D warnings

      # Defense in depth for the SAME defect `cargo metadata --locked` above
      # exists to catch: ~80 cargo invocations follow that step in this job,
      # none of them passing --locked, and any one of them resolving a
      # dependency differently than the committed lockfile would silently
      # rewrite the in-runner Cargo.lock the same way the unlocked
      # `cargo test -p mlmf-core` steps were measured to do (see the comment
      # on the step above). Moving the check to run first stops it from
      # being MASKED by an earlier unlocked step; it does not stop a LATER
      # one from drifting the file after the check already passed. This
      # compares the file on disk against what HEAD committed, one final
      # time, after everything else in the job has had a chance to touch it.
      - name: git diff --exit-code Cargo.lock
        shell: bash
        run: git diff --exit-code -- Cargo.lock

  # Advisory-only, non-blocking portfolio-wide code scan (CireSnave,
  # 2026-10-23: "Roll out advisory-only, non-blocking CodeRipper checks
  # everywhere."). Deliberately NOT a required status check: it reports
  # findings without gating merges, and nothing here may be promoted into a
  # required check or used to silence an existing rule.
  portfolio:
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@ee9c3950c510fae136d316fed3bd9ecda343cede # 0.9.24
